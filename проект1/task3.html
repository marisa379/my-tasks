<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
</head>
<body>
    <h1>Форма обратной связи</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Личные данные</legend>

            <label for="name">Имя (обязательно):</label><br>
            <input type="text" id="name" name="username" required><br><br>

            <label for="email">Email (обязательно):</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label>Пол:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Мужской</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Женский</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Другой</label>
            <br><br>

            <label for="country">Страна проживания:</label><br>
            <select id="country" name="country">
                <option value="ru">Россия</option>
                <option value="by">Беларусь</option>
                <option value="kz">Казахстан</option>
            </select>
            <br><br>

            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">Согласие на обработку данных (обязательно)</label>
            <br><br>

            <input type="submit" value="Отправить">
        </fieldset>
    </form>
</body>
</html>
