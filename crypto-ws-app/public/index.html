<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Котировки криптовалют</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      padding: 30px 35px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 900px;
      border: 1px solid #334155;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      color: #e2e8f0;
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #94a3b8;
    }

    .status-bar .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status.connected {
      color: #4ade80;
    }

    .status.disconnected {
      color: #f87171;
    }

    .status .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .status.connected .dot {
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
    }

    .status.disconnected .dot {
      background: #f87171;
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.4);
    }

    .last-update {
      color: #64748b;
      font-size: 13px;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead {
      background: #1e293b;
    }

    th {
      padding: 14px 18px;
      text-align: left;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #334155;
    }

    td {
      padding: 14px 18px;
      color: #e2e8f0;
      border-bottom: 1px solid #1e293b;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(51, 65, 85, 0.3);
    }

    .symbol {
      font-weight: 600;
      color: #e2e8f0;
    }

    .symbol .icon {
      margin-right: 8px;
    }

    .price {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }

    .price.up {
      color: #4ade80;
    }

    .price.down {
      color: #f87171;
    }

    .price.neutral {
      color: #e2e8f0;
    }

    .time {
      color: #64748b;
      font-size: 13px;
    }

    .no-data {
      text-align: center;
      color: #64748b;
      padding: 30px 0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      th,
      td {
        padding: 10px 12px;
        font-size: 13px;
      }
      h1 {
        font-size: 20px;
      }
      .status-bar {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 Котировки криптовалют</h1>
  <p class="subtitle">Обновление в реальном времени через WebSocket</p>

  <div class="status-bar">
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">Подключение...</span>
    </div>
    <span class="last-update" id="lastUpdate">Ожидание данных...</span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Валюта</th>
          <th>Цена (USDT)</th>
          <th>Обновлено</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="3" class="no-data">Загрузка данных...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const SERVER_URL = 'ws://localhost:8080';
  const tableBody = document.getElementById('tableBody');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const lastUpdateEl = document.getElementById('lastUpdate');

  let prices = {};
  let isConnected = false;

  function setStatus(connected, text) {
    isConnected = connected;
    statusText.textContent = text;
    statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
  }

  function renderTable(data) {
    const entries = Object.entries(data);

    if (entries.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="3" class="no-data">Нет данных</td></tr>`;
      return;
    }

    entries.sort((a, b) => a[0].localeCompare(b[0]));

    let html = '';
    entries.forEach(([key, value]) => {
      const symbol = value.symbol || key.toUpperCase();
      const price = value.price || '--';
      const time = value.time || '--';

      html += `
        <tr>
          <td class="symbol"><span class="icon">🪙</span> ${symbol}</td>
          <td class="price neutral" id="price-${key}">$${price}</td>
          <td class="time">${time}</td>
        </tr>
      `;
    });

    tableBody.innerHTML = html;

    entries.forEach(([key, value]) => {
      const priceEl = document.getElementById(`price-${key}`);
      if (!priceEl) return;

      const currentPrice = parseFloat(value.price);
      const prevPrice = prices[key]?.price ? parseFloat(prices[key].price) : null;

      if (prevPrice !== null && !isNaN(prevPrice) && !isNaN(currentPrice)) {
        if (currentPrice > prevPrice) {
          priceEl.className = 'price up';
        } else if (currentPrice < prevPrice) {
          priceEl.className = 'price down';
        } else {
          priceEl.className = 'price neutral';
        }
        setTimeout(() => {
          priceEl.className = 'price neutral';
        }, 800);
      } else {
        priceEl.className = 'price neutral';
      }
    });

    const times = entries.map(([_, v]) => v.time).filter(t => t !== '--');
    if (times.length > 0) {
      lastUpdateEl.textContent = `🕐 Последнее обновление: ${times[times.length - 1]}`;
    }
  }

  let ws = null;
  let reconnectAttempts = 0;
  const MAX_RECONNECT_ATTEMPTS = 10;
  const RECONNECT_DELAY = 3000;

  function connectWebSocket() {
    try {
      ws = new WebSocket(SERVER_URL);

      ws.onopen = () => {
        console.log('Подключено к серверу');
        setStatus(true, 'Подключено');
        reconnectAttempts = 0;
      };

      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);

          if (message.type === 'init') {
            prices = message.data;
            renderTable(prices);
            setStatus(true, 'Подключено');
          } else if (message.type === 'update') {
            const oldPrices = { ...prices };
            prices = message.data;
            renderTable(prices);

            const entries = Object.entries(prices);
            const times = entries.map(([_, v]) => v.time).filter(t => t !== '--');
            if (times.length > 0) {
              lastUpdateEl.textContent = `🕐 Последнее обновление: ${times[times.length - 1]}`;
            }
          }
        } catch (err) {
          console.error('Ошибка обработки сообщения:', err.message);
        }
      };

      ws.onerror = (err) => {
        console.error('Ошибка WebSocket:', err);
        setStatus(false, 'Ошибка соединения');
      };

      ws.onclose = () => {
        console.warn('Соединение с сервером закрыто');
        setStatus(false, 'Переподключение...');
        ws = null;

        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
          reconnectAttempts++;
          console.log(`Попытка ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS}`);
          setTimeout(connectWebSocket, RECONNECT_DELAY);
        } else {
          setStatus(false, 'Не удалось подключиться');
          tableBody.innerHTML = `<tr><td colspan="3" class="no-data">❌ Нет соединения с сервером</td></tr>`;
          console.error('Превышено количество попыток переподключения');
        }
      };

    } catch (err) {
      console.error('Критическая ошибка:', err.message);
      setStatus(false, 'Критическая ошибка');
    }
  }

  connectWebSocket();

  window.addEventListener('beforeunload', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.close();
    }
  });

  console.log('Клиент запущен. Ожидание данных от сервера...');
</script>
</body>
</html>
